
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceTrack | Employee Login</title>
<style>
:root {
    --blue: #1558ff;
    --cyan: #62dfff;
    --navy: #071b49;
    --text: #14264d;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    color: var(--text);
    background:
        radial-gradient(ellipse at 30% 45%, rgba(40, 103, 255, .42), transparent 42%),
        radial-gradient(ellipse at 70% 10%, rgba(106, 224, 255, .35), transparent 35%),
        linear-gradient(125deg, #eaf1ff, #9db9f0 48%, #eaf5ff);
    overflow-x: hidden;
}
.page {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(380px, .85fr);
    align-items: center;
    gap: 4vw;
    padding: 40px 6vw;
    position: relative;
    isolation: isolate;
}
/* Animated ambient background */
.page::before,
.page::after {
    content: "";
    position: fixed;
    z-index: -1;
    pointer-events: none;
    border-radius: 50%;
    filter: blur(1px);
}
.page::before {
    width: 480px;
    height: 480px;
    left: -150px;
    bottom: -220px;
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: 0 0 55px rgba(36, 108, 255, .25);
    animation: floatGlow 9s ease-in-out infinite alternate;
}
.page::after {
    width: 360px;
    height: 360px;
    right: -100px;
    top: -180px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.65);
    animation: floatGlow 7s ease-in-out infinite alternate-reverse;
}
@keyframes floatGlow {
    from { transform: translate3d(0, 0, 0) rotate(0deg); }
    to { transform: translate3d(24px, -22px, 0) rotate(12deg); }
}
/* Brand */
.brand-area {
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
}
.brand {
    display: flex;
    align-items: center;
    gap: 18px;
    width: fit-content;
    max-width: 100%;
    animation: brandSlide 1.4s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes brandSlide {
    from { opacity: 0; transform: translateX(-65px); }
    to { opacity: 1; transform: translateX(0); }
}
.logo-icon {
    width: 76px;
    height: 76px;
    flex: 0 0 auto;
    color: var(--blue);
    position: relative;
    display: grid;
    place-items: center;
}
.logo-icon svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}
.logo-icon .face-lines {
    animation: facePulse 3s ease-in-out infinite;
    transform-origin: center;
}
@keyframes facePulse {
    0%, 100% { opacity: .75; }
    50% { opacity: 1; filter: drop-shadow(0 0 5px #54dcff); }
}
.brand-copy {
    min-width: 0;
    animation: wordSlide 1.8s cubic-bezier(.16,1,.3,1) both;
}
@keyframes wordSlide {
    from { transform: translateX(-22px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.brand-name {
    color: var(--navy);
    font-size: clamp(30px, 4vw, 56px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1.05;
    white-space: nowrap;
}
.brand-name span {
    color: var(--blue);
}
.brand-subtitle {
    margin-top: 9px;
    color: #263e6b;
    font-size: clamp(12px, 1.2vw, 17px);
    letter-spacing: .2px;
}
.brand-rule {
    width: 110px;
    height: 4px;
    border-radius: 10px;
    margin: 28px 0 35px;
    background: linear-gradient(90deg, var(--blue), var(--cyan), transparent);
    animation: ruleGrow 1.3s ease-out both;
}
@keyframes ruleGrow {
    from { width: 0; }
    to { width: 110px; }
}
/* Holographic scanning face */
.holo-stage {
    width: min(100%, 570px);
    height: 360px;
    position: relative;
    display: grid;
    place-items: center;
    margin-left: 5px;
}
.holo-orbit {
    position: absolute;
    width: 85%;
    height: 35%;
    border: 2px solid rgba(103, 230, 255, .85);
    border-left-color: transparent;
    border-right-color: rgba(255,255,255,.8);
    border-radius: 50%;
    transform: rotate(-13deg);
    box-shadow: 0 0 14px rgba(40, 191, 255, .35);
    animation: orbit 8s linear infinite;
}
.holo-orbit.orbit-two {
    width: 75%;
    height: 48%;
    transform: rotate(62deg);
    border-color: rgba(255,255,255,.6);
    border-top-color: #55dcff;
    animation-duration: 11s;
    animation-direction: reverse;
}
@keyframes orbit {
    to { rotate: 360deg; }
}
.face-frame {
    width: 230px;
    height: 270px;
    position: relative;
    display: grid;
    place-items: center;
    color: #f7fdff;
    filter: drop-shadow(0 0 14px rgba(48, 207, 255, .65));
    animation: faceFloat 4s ease-in-out infinite;
}
@keyframes faceFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.face-frame svg {
    width: 100%;
    height: 100%;
}
.scan-bracket {
    position: absolute;
    width: 48px;
    height: 48px;
    border-color: #74edff;
    border-style: solid;
    filter: drop-shadow(0 0 7px #42cfff);
    animation: bracketGlow 2s ease-in-out infinite alternate;
}
.scan-bracket.tl {
    top: 3px;
    left: 0;
    border-width: 4px 0 0 4px;
    border-radius: 12px 0 0;
}
.scan-bracket.tr {
    top: 3px;
    right: 0;
    border-width: 4px 4px 0 0;
    border-radius: 0 12px 0 0;
}
.scan-bracket.bl {
    bottom: 3px;
    left: 0;
    border-width: 0 0 4px 4px;
    border-radius: 0 0 0 12px;
}
.scan-bracket.br {
    bottom: 3px;
    right: 0;
    border-width: 0 4px 4px 0;
    border-radius: 0 0 12px;
}
@keyframes bracketGlow {
    from { opacity: .6; }
    to { opacity: 1; }
}
.scan-line {
    position: absolute;
    top: 12%;
    left: 5%;
    width: 90%;
    height: 3px;
    background: #8df5ff;
    box-shadow: 0 0 12px #43dfff, 0 0 25px #43dfff;
    animation: scan 3.5s ease-in-out infinite alternate;
}
@keyframes scan {
    from { top: 12%; opacity: .5; }
    to { top: 86%; opacity: 1; }
}
.holo-status {
    position: absolute;
    left: 0;
    bottom: 5px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 12px 16px;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 12px;
    background: rgba(28, 83, 175, .35);
    backdrop-filter: blur(10px);
}
.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #60ffe0;
    box-shadow: 0 0 12px #60ffe0;
    animation: dotPulse 1.5s infinite;
}
@keyframes dotPulse {
    50% { opacity: .35; }
}
/* Glass login panel */
.login-box {
    width: 100%;
    max-width: 520px;
    justify-self: end;
    padding: clamp(25px, 3.3vw, 48px);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(255,255,255,.86), rgba(255,255,255,.67));
    box-shadow: 0 25px 70px rgba(31, 69, 143, .18),
                inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(22px);
    animation: panelEnter 1s .15s ease-out both;
}
@keyframes panelEnter {
    from { opacity: 0; transform: translateY(22px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.panel-heading {
    text-align: center;
    font-size: clamp(23px, 2.4vw, 34px);
    font-weight: 800;
    letter-spacing: -.8px;
    color: var(--navy);
    margin-bottom: 12px;
}
.panel-heading span {
    color: var(--blue);
}
.heading-line {
    width: 56px;
    height: 5px;
    border-radius: 10px;
    margin: 0 auto 27px;
    background: linear-gradient(90deg, var(--blue), var(--cyan));
}
.error {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ffc9c9;
    background: #fff1f1;
    color: #a51d2d;
    font-size: 13px;
    margin-bottom: 18px;
}
.field {
    margin-bottom: 17px;
    position: relative;
}
.field label {
    display: block;
    margin-bottom: 8px;
    color: #31456d;
    font-size: 13px;
    font-weight: 700;
}
.field input {
    width: 100%;
    height: 54px;
    padding: 0 16px;
    border: 1px solid rgba(74, 112, 180, .23);
    border-radius: 13px;
    outline: none;
    background: rgba(255,255,255,.76);
    color: var(--navy);
    font-size: 14px;
    transition: border .2s, box-shadow .2s, background .2s;
}
.field input::placeholder {
    color: #8292b2;
}
.field input:focus {
    border-color: #397dff;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(21,88,255,.1);
}
.options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 0 23px;
    font-size: 12px;
}
.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #35496f;
}
.remember input {
    accent-color: var(--blue);
    width: 15px;
    height: 15px;
}
.options a,
.register a,
.back a {
    color: var(--blue);
    font-weight: 700;
    text-decoration: none;
}
.options a:hover,
.register a:hover,
.back a:hover {
    text-decoration: underline;
}
.login-button {
    width: 100%;
    min-height: 58px;
    border: none;
    border-radius: 15px;
    color: #fff;
    background: linear-gradient(100deg, #174aff, #2e78ff 60%, #42b8f7);
    box-shadow: 0 10px 24px rgba(21,88,255,.24);
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, filter .2s;
}
.login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(21,88,255,.32);
    filter: brightness(1.04);
}
.login-button:active {
    transform: translateY(0);
}
.register {
    margin-top: 22px;
    text-align: center;
    color: #617294;
    font-size: 13px;
}
.back {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
}
.back a {
    color: #52678e;
    font-weight: 500;
}
.footer {
    text-align: center;
    margin-top: 24px;
    color: #8190ad;
    font-size: 11px;
}
/* Mobile layout */
@media (max-width: 900px) {
    .page {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 30px 20px;
    }
    .brand-area {
        align-items: center;
        text-align: center;
    }
    .brand {
        gap: 12px;
    }
    .logo-icon {
        width: 58px;
        height: 58px;
    }
    .brand-rule {
        margin: 20px 0 0;
    }
    .holo-stage {
        height: 260px;
        max-width: 440px;
        margin: 0 auto;
    }
    .face-frame {
        width: 175px;
        height: 215px;
    }
    .holo-status {
        bottom: 0;
        left: 5%;
    }
    .login-box {
        justify-self: center;
        max-width: 500px;
    }
}
@media (max-width: 480px) {
    .page {
        padding: 25px 14px;
    }
    .brand-name {
        font-size: 29px;
        letter-spacing: -1px;
    }
    .brand-subtitle {
        font-size: 11px;
    }
    .holo-stage {
        height: 225px;
    }
    .face-frame {
        width: 150px;
        height: 190px;
    }
    .login-box {
        padding: 25px 20px;
        border-radius: 22px;
    }
    .options {
        font-size: 11px;
    }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>
<main class="page">
    <section class="brand-area" aria-label="FaceTrack branding">
        <div class="brand">
            <div class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 100 100" fill="none">
                    <path d="M36 9H15Q9 9 9 16V37 M64 9H85Q91 9 91 16V37 M9 63V84Q9 91 16 91H37 M91 63V84Q91 91 84 91H63"
                          stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
                    <g class="face-lines" stroke="currentColor" stroke-width="1.5">
                        <path d="M50 19C33 19 26 34 28 51L31 66L42 79L50 84L58 79L69 66L72 51C74 34 67 19 50 19Z"/>
                        <path d="M28 43L42 30L50 19L59 31L72 43M29 52L43 45L50 54L58 45L71 52M32 65L44 61L50 70L57 61L68 65M42 30L43 45L44 61L42 78M59 31L58 45L57 61L58 78M50 19V84M28 43L50 54L72 43M31 66L50 70L69 66"/>
                        <path d="M36 50H43M57 50H64M44 68Q50 73 56 68" stroke-width="2" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>
            <div class="brand-copy">
                <div class="brand-name">FACE<span>TRACK</span></div>
                <div class="brand-subtitle">Face Recognition Attendance System</div>
            </div>
        </div>
        <div class="brand-rule"></div>
        <div class="holo-stage" aria-label="Animated face scanning illustration">
            <div class="holo-orbit"></div>
            <div class="holo-orbit orbit-two"></div>
            <div class="face-frame">
                <div class="scan-bracket tl"></div>
                <div class="scan-bracket tr"></div>
                <div class="scan-bracket bl"></div>
                <div class="scan-bracket br"></div>
                <svg viewBox="0 0 230 270" fill="none" aria-hidden="true">
                    <g stroke="rgba(255,255,255,.92)" stroke-width="1.6">
                        <path d="M115 18C79 18 58 43 57 80L54 121C53 154 70 180 91 198L115 214L139 198C160 180 177 154 176 121L173 80C172 43 151 18 115 18Z"/>
                        <path d="M57 80L88 53L115 18L143 53L173 80M54 121L83 102L115 117L147 102L176 121M63 155L94 145L115 162L136 145L167 155M91 198L97 174L115 162L133 174L139 198"/>
                        <path d="M88 53L83 102L94 145L97 174M143 53L147 102L136 145L133 174M115 18V214M57 80L115 117L173 80M54 121L115 162L176 121M63 155L115 162L167 155"/>
                        <path d="M78 94L96 91M134 91L152 94M99 134L108 137L115 134L122 137L131 134M100 165Q115 176 130 165" stroke-width="2" stroke-linecap="round"/>
                        <path d="M72 68L88 53L102 43M158 68L143 53L128 43M68 143L83 155M162 143L147 155"/>
                    </g>
                    <g fill="#a4f6ff">
                        <circle cx="115" cy="18" r="3"/>
                        <circle cx="57" cy="80" r="3"/>
                        <circle cx="173" cy="80" r="3"/>
                        <circle cx="115" cy="117" r="3"/>
                        <circle cx="54" cy="121" r="3"/>
                        <circle cx="176" cy="121" r="3"/>
                        <circle cx="115" cy="162" r="3"/>
                        <circle cx="97" cy="174" r="2.5"/>
                        <circle cx="133" cy="174" r="2.5"/>
                    </g>
                    <path d="M115 214V252" stroke="#71eaff" stroke-width="2" stroke-dasharray="5 7"/>
                </svg>
                <div class="scan-line"></div>
            </div>
            <div class="holo-status">
                <span class="status-dot"></span>
                FaceTrack biometric system
            </div>
        </div>
    </section>

    <section class="login-box">
        <h1 class="panel-heading">Login to <span>FACETRACK</span></h1>
        <div class="heading-line"></div>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form action="/employee/login" method="POST">
            <!-- CSRF security token -->
            <input
                type="hidden"
                name="csrf_token"
                value="{{ session.get('_csrf_token', '') }}"
            >

            <div class="field">
                <label for="employee_id">Employee ID</label>
                <input
                    type="text"
                    id="employee_id"
                    name="employee_id"
                    placeholder="Enter your employee ID"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#" onclick="return false;" title="Password recovery is not configured">Forgot password?</a>
            </div>

            <button class="login-button" type="submit">
                Sign In <span aria-hidden="true">→</span>
            </button>
        </form>

        <div class="register">
            New employee?
            <a href="/employee/register">Create an account</a>
        </div>

        <div class="back">
            <a href="/">← Back to portal selection</a>
        </div>

        <div class="footer">
            FaceTrack · Face Recognition Attendance System
        </div>
    </section>
</main>
</body>
</html>
