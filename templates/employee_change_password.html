<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | FaceTrack</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            background: #f3f6fb;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(20, 35, 60, 0.08);
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eaf0ff;
            border-radius: 15px;
            font-size: 28px;
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 26px;
            text-align: center;
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .password-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 13px 48px 13px 12px;
            border: 1px solid #cfd5df;
            border-radius: 8px;
            background: #ffffff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #315bea;
            box-shadow: 0 0 0 3px rgba(49, 91, 234, 0.12);
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: auto;
            padding: 5px;
            border: none;
            background: transparent;
            color: #315bea;
            font-size: 12px;
            cursor: pointer;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #315bea;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #2448c7;
        }

        .back-link {
            display: block;
            margin-top: 23px;
            text-align: center;
            color: #315bea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .hint {
            margin-top: 7px;
            color: #667085;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="icon">🔒</div>

        <h1>Change Password</h1>

        <p class="subtitle">
            Update your employee account password securely.
        </p>

        {% if success %}
            <div class="message success" role="status">
                {{ success }}
            </div>
        {% endif %}

        {% if error %}
            <div class="message error" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="POST"
            action="{{ url_for('employee_change_password') }}"
            autocomplete="off"
        >
            <div class="field">
                <label for="current_password">Current Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        placeholder="Enter current password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('current_password', this)"
                    >Show</button>
                </div>
            </div>

            <div class="field">
                <label for="new_password">New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('new_password', this)"
                    >Show</button>
                </div>

                <p class="hint">Use at least 8 characters.</p>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirm_password', this)"
                    >Show</button>
                </div>
            </div>

            <button type="submit" class="submit-button">
                Update Password
            </button>
        </form>

        <a class="back-link" href="{{ url_for('employee_profile') }}">
            &larr; Back to My Profile
        </a>

    </main>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "Hide";
            } else {
                input.type = "password";
                button.textContent = "Show";
            }
        }
    </script>
</body>
</html>
